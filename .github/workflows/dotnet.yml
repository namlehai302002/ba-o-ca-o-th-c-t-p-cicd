name: WMS CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test WMS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore WMS.sln

      - name: Build WMS
        run: dotnet build WMS.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test WMS.Tests/WMS.Tests.csproj --configuration Release --no-build --verbosity normal